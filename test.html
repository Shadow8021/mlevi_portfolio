      },
      {

        title: "Premiers Jeux Olympiques",

        color: "#4a90a4",

      },
      {

        year: "753 av. J.-C.",
        title: "Fondation de Rome",
        civilization: "rome",

        color: "#c0392b",
        summary: "Selon la légende, Romulus fonde la ville de Rome.",
        details: "La légende raconte que Romulus et Rémus, jumeaux abandonnés et allaités par une louve, fondèrent Rome. Romulus tua son frère lors d'une dispute et devint le premier roi de Rome.",

      },
      {

        civilization: "rome",

        color: "#c0392b",
        summary: "Jules César est assassiné aux Ides de Mars.",
        details: "Poignardé 23 fois par des sénateurs romains, César mourut au pied de la statue de Pompée. Ses derniers mots auraient été 'Tu quoque, mi fili' (Toi aussi, mon fils) en voyant Brutus parmi ses assassins.",
        funFact: "🎯 Le saviez-vous ? Le mois de juillet (July en anglais) porte le nom de Jules César !"
      },
      {
        id: 7,
        year: "27 av. J.-C.",

        details: "Octave, petit-neveu de César, reçoit le titre d'Auguste du Sénat. Il instaure la Pax Romana, une période de paix relative qui durera plus de 200 ans. L'Empire s'étend de la Bretagne à l'Égypte.",
        funFact: "🎯 Le saviez-vous ? Le mois d'août (August) est nommé en l'honneur d'Auguste !"
      },
      {
        id: 8,
        year: "331 av. J.-C.",
        title: "Alexandre conquiert la Perse",
        civilization: "greece",

        details: "Cette victoire décisive permit à Alexandre de conquérir l'Empire perse. À seulement 25 ans, il contrôlait un territoire allant de la Grèce à l'Inde. Il fonda plus de 70 villes, dont Alexandrie en Égypte.",
        funFact: "🎯 Le saviez-vous ? Alexandre n'a jamais perdu une seule bataille de toute sa vie !"
      },
      {
        id: 9,
        year: "1336 av. J.-C.",
        title: "Règne de Toutânkhamon",
        civilization: "egypt",
        emoji: "😷",
        color: "#e6b422",
        summary: "Le jeune pharaon Toutânkhamon monte sur le trône.",
        details: "Devenu pharaon à 9 ans, Toutânkhamon mourut mystérieusement à 19 ans. Sa tombe, découverte en 1922 par Howard Carter, contenait plus de 5 000 objets précieux, dont son célèbre masque funéraire en or.",
        funFact: "🎯 Le saviez-vous ? La malédiction du pharaon serait responsable de la mort de plusieurs personnes ayant ouvert sa tombe !"
      },
      {
        id: 10,
        year: "476 apr. J.-C.",
        title: "Chute de Rome",
        civilization: "rome",
        emoji: "🏚️",
        color: "#c0392b",
        summary: "Romulus Augustule, dernier empereur, est déposé.",
        details: "Odoacre, chef des Hérules, dépose le jeune empereur et renvoie les insignes impériaux à Constantinople. Cet événement marque traditionnellement la fin de l'Antiquité et le début du Moyen Âge en Occident.",
        funFact: "🎯 Le saviez-vous ? Le dernier empereur portait le même nom que le fondateur légendaire de Rome !"
      }
    ];

    let currentFilter = 'all';
    let expandedCards = new Set();

    function sortEvents(events) {
      return events.sort((a, b) => {
        const parseYear = (yearStr) => {
          const num = parseInt(yearStr.replace(/[^\d-]/g, ''));
          return yearStr.includes('apr.') ? num : -num;
        };
        return parseYear(a.year) - parseYear(b.year);
      });
    }

    function renderTimeline() {
      const container = document.getElementById('timeline-container');
      const sortedEvents = sortEvents([...events]);
      const filteredEvents = currentFilter === 'all' 
        ? sortedEvents 
        : sortedEvents.filter(e => e.civilization === currentFilter);

      container.innerHTML = filteredEvents.map((event, index) => {
        const isLeft = index % 2 === 0;
        const isExpanded = expandedCards.has(event.id);
        
        return `
          <div class="event-card relative flex items-center ${isLeft ? 'flex-row' : 'flex-row-reverse'} animate-fade-in"
               data-civilization="${event.civilization}"
               style="animation-delay: ${index * 0.1}s;">
            
            <!-- Timeline Dot -->
            <div class="absolute left-1/2 transform -translate-x-1/2 z-10">
              <div class="timeline-dot w-4 h-4 rounded-full border-2" 
                   style="background-color: ${event.color}; border-color: ${event.color}; color: ${event.color};">
              </div>
            </div>

            <!-- Date Badge -->
            <div class="w-5/12 ${isLeft ? 'text-right pr-8' : 'text-left pl-8'}">
              <span class="inline-block px-3 py-1 rounded-full font-cinzel text-xs font-semibold"
                    style="background-color: ${event.color}20; color: ${event.color}; border: 1px solid ${event.color}40;">
                ${event.year}
              </span>
            </div>

            <!-- Card -->
            <div class="w-5/12 ${isLeft ? 'pl-8' : 'pr-8'}">
              <div class="card-expand rounded-xl p-4 cursor-pointer transform hover:scale-102 hover:-translate-y-1"
                   style="background-color: #2d2d44; border-left: 4px solid ${event.color}; box-shadow: 0 4px 20px rgba(0,0,0,0.3);"
                   onclick="toggleCard(${event.id})">
                
                <!-- Card Header -->
                <div class="flex items-start gap-3">
                  <span class="text-2xl">${event.emoji}</span>
                  <div class="flex-1">
                    <h3 class="font-cinzel font-semibold text-base" style="color: #f5f0e6;">
                      ${event.title}
                    </h3>
                    <p class="font-crimson text-sm mt-1" style="color: #a9a9a9;">
                      ${event.summary}
                    </p>
                  </div>
                  <span class="transform transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}" 
                        style="color: ${event.color};">
                    ▼
                  </span>
                </div>

                <!-- Expandable Content -->
                <div class="card-content ${isExpanded ? 'expanded' : ''}">
                  <div class="card-inner">
                    <div class="mt-4 pt-4" style="border-top: 1px solid #404060;">
                      <p class="font-crimson text-sm leading-relaxed" style="color: #d0d0d0;">
                        ${event.details}
                      </p>
                      <div class="mt-3 p-3 rounded-lg" style="background-color: ${event.color}15;">
                        <p class="font-crimson text-sm italic" style="color: ${event.color};">
                          ${event.funFact}
                        </p>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function toggleCard(id) {
      if (expandedCards.has(id)) {
        expandedCards.delete(id);
      } else {
        expandedCards.add(id);
      }
      renderTimeline();
    }

    function filterCivilization(civ) {
      currentFilter = civ;
      
      document.querySelectorAll('.civilization-filter').forEach(btn => {
        const isActive = btn.dataset.civ === civ;
        btn.classList.toggle('active', isActive);
        btn.style.borderColor = isActive ? '#d4af37' : 'transparent';
      });

      renderTimeline();
    }

    async function onConfigChange(config) {
      const title = config.timeline_title || defaultConfig.timeline_title;
      const subtitle = config.subtitle_text || defaultConfig.subtitle_text;
      
      document.getElementById('main-title').textContent = title;
      document.getElementById('subtitle').textContent = subtitle;
    }

    function mapToCapabilities(config) {
      return {
        recolorables: [
          {
            get: () => config.background_color || defaultConfig.background_color,
            set: (value) => {
              config.background_color = value;
              window.elementSdk.setConfig({ background_color: value });
            }
          },
          {
            get: () => config.card_color || defaultConfig.card_color,
            set: (value) => {
              config.card_color = value;
              window.elementSdk.setConfig({ card_color: value });
            }
          },
          {
            get: () => config.text_color || defaultConfig.text_color,
            set: (value) => {
              config.text_color = value;
              window.elementSdk.setConfig({ text_color: value });
            }
          },
          {
            get: () => config.accent_color || defaultConfig.accent_color,
            set: (value) => {
              config.accent_color = value;
              window.elementSdk.setConfig({ accent_color: value });
            }
          },
          {
            get: () => config.secondary_color || defaultConfig.secondary_color,
            set: (value) => {
              config.secondary_color = value;
              window.elementSdk.setConfig({ secondary_color: value });
            }
          }
        ],
        borderables: [],
        fontEditable: {
          get: () => config.font_family || 'Cinzel',
          set: (value) => {
            config.font_family = value;
            window.elementSdk.setConfig({ font_family: value });
          }
        },
        fontSizeable: {
          get: () => config.font_size || 16,
          set: (value) => {
            config.font_size = value;
            window.elementSdk.setConfig({ font_size: value });
          }
        }
      };
    }

    function mapToEditPanelValues(config) {
      return new Map([
        ["timeline_title", config.timeline_title || defaultConfig.timeline_title],
        ["subtitle_text", config.subtitle_text || defaultConfig.subtitle_text]
      ]);
    }

    // Initialize
    window.elementSdk.init({
      defaultConfig,
      onConfigChange,
      mapToCapabilities,
      mapToEditPanelValues
    });

    renderTimeline();
  </script>
